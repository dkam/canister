services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - /videos:/videos
      - /transcodes:/transcodes
      - /storage:/app/storage
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - DEFAULT_LIBRARY_PATH=/videos
      - TRANSCODE_PATH=/transcodes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
